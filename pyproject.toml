[project]
name = "smriti-restore"
version = "0.1.0"
description = "Diffusion photo restoration with a fault-tolerant pull-based GPU pipeline"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "web",
    "data",
    "outputs",
    "lora",
    "eval/samples",
    # Notebooks legitimately use shell magics and imports part-way down a cell.
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults is the documented pattern
    "RUF012",  # ClassVar annotations add noise to SQLAlchemy models
]

[tool.ruff.lint.per-file-ignores]
"ml/evaluate.py" = ["C901"]
"worker/pipeline.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
